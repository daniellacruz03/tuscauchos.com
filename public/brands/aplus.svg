<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Fondo negro como la parte superior de la etiqueta A-Plus -->
  <rect width="240" height="60" rx="6" fill="#111111"/>
  <!-- Franja amarilla inferior (como la etiqueta real) -->
  <rect y="20" width="240" height="40" rx="0" fill="#F5C800"/>
  <!-- Redondear esquinas inferiores -->
  <rect y="40" width="240" height="20" rx="0" fill="#F5C800"/>
  <rect y="54" width="240" height="6" rx="6" fill="#F5C800"/>
  <!-- Texto APLUS en negro bold italic enorme como la etiqueta -->
  <text
    x="120"
    y="52"
    font-family="'Arial Black', 'Impact', 'Oswald', Arial, sans-serif"
    font-size="33"
    font-weight="900"
    font-style="italic"
    letter-spacing="1"
    fill="#111111"
    text-anchor="middle"
    dominant-baseline="auto"
  >APLUS</text>
  <!-- Pequeña línea blanca encima del texto -->
  <text
    x="120"
    y="17"
    font-family="'Arial', sans-serif"
    font-size="12"
    font-weight="700"
    font-style="italic"
    letter-spacing="3"
    fill="white"
    text-anchor="middle"
    dominant-baseline="auto"
  >APLUS</text>
</svg>
