  <!-- SERVICAUCHOS -->
  <text x="82" y="19" font-family="Arial Black, sans-serif" font-weight="900" font-size="9.5" fill="white" text-anchor="middle" letter-spacing="1">SERVICAUCHOS</text>
  <!-- LIBERTADOR en rojo -->
