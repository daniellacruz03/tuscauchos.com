<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" width="140" height="48">
  <rect width="140" height="48" rx="8" fill="#0E1218"/>
  <defs>
    <linearGradient id="lg2" x1="0" y1="0" x2="140" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D90429" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0E1218" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="140" height="48" rx="8" fill="url(#lg2)"/>
  <!-- Borde rojo -->
