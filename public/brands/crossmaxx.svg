<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Fondo azul oscuro/degradado como en la etiqueta -->
  <defs>
    <linearGradient id="cxbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <rect width="240" height="60" rx="6" fill="url(#cxbg)"/>
  <!-- Texto CROSSMAXX en blanco bold como la etiqueta -->
  <text
    x="120"
    y="35"
    font-family="'Arial Narrow', 'Impact', Arial, sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="1.5"
    fill="white"
    text-anchor="middle"
    dominant-baseline="auto"
  >CROSSMAXX</text>
  <!-- Tagline "Go Beyond Limits" pequeña en cursiva -->
  <text
    x="120"
    y="52"
    font-family="'Arial', sans-serif"
    font-size="10"
    font-weight="400"
    font-style="italic"
    letter-spacing="0.5"
    fill="#90CAF9"
    text-anchor="middle"
    dominant-baseline="auto"
  >Go Beyond Limits</text>
</svg>
