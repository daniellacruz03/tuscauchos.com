<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <!-- Fondo negro como en el logo Zega real -->
  <rect width="220" height="60" rx="6" fill="#111111"/>

  <!-- Letras ZEGA en blanco, fuente blocky bold condensada -->
  <text
    x="20"
    y="46"
    font-family="'Arial Black', 'Arial Narrow', 'Impact', Arial, sans-serif"
    font-size="40"
    font-weight="900"
    letter-spacing="-1"
    fill="white"
  >ZEGA</text>

  <!-- Flecha/triángulo rojo diagonal característica del logo (debajo de la última letra) -->
  <!-- Triángulo rojo inclinado, típico del logo Zega, en la esquina inferior derecha -->
  <polygon
    points="170,60 210,60 210,20"
    fill="#CC0000"
  />

  <!-- Símbolo ® pequeño arriba a la derecha del texto -->
  <text
    x="194"
    y="20"
    font-family="Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="white"
  >®</text>
</svg>
